name: Deploy to production

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - run: git checkout -B prod

      - name: Minify .css
        uses: nizarmah/auto-minify@v3
        with:
          overwrite: true
          directory: "css"

      - name: Minify .js
        uses: nizarmah/auto-minify@v3
        with:
          overwrite: true
          directory: "js"

      - name: Remove unnecessary files
        run: |
          rm -f web.Rproj
          rm -f web.code-workspace
          rm -f .rooignore
          rm -f README.md

      - name: Set timestamp
        id: set_timestamp
        run: |
          echo "timestamp=$(date -u +\"%Y-%m-%dT%H:%M:%S\")" >> $GITHUB_OUTPUT

      - name: Commit all changes to prod (single commit)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Prodification - ${{ steps.set_timestamp.outputs.timestamp }}"
          branch: prod
          push_options: '--force'
